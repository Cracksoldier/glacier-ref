name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No secrets are used; untrusted pull requests run with a read-only token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-release, ci-asan]
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read toolchain pins
        run: grep -E '^[A-Z_]+=' .github/qt-version.env >> "$GITHUB_ENV"

      - name: Install build dependencies and test locale
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build locales \
            libgl1-mesa-dev libxkbcommon-dev libfontconfig1
          sudo locale-gen de_AT.UTF-8

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtimageformats
          aqtversion: ==${{ env.AQT_VERSION }}
          cache: true
          cache-key-prefix: qt-linux-x64-gcc14

      - name: Enable GCC/Clang problem matcher
        run: echo "::add-matcher::.github/problem-matchers/gcc.json"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test (default and de_AT locale)
        run: ctest --preset ${{ matrix.preset }}

  windows:
    name: Windows (MSVC, ${{ matrix.config }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read toolchain pins
        shell: bash
        run: grep -E '^[A-Z_]+=' .github/qt-version.env >> "$GITHUB_ENV"

      # aqtinstall 3.3.0 cannot read the per-architecture Windows repository
      # layout of current Qt releases, so Windows uses our own fetch script
      # (official download.qt.io metadata, SHA-1 verified). See docs/TOOLCHAIN.md.
      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-windows-x64-msvc2022-${{ env.QT_VERSION }}-${{ hashFiles('tools/ci/fetch_qt_windows.py') }}

      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: bash
        run: >
          python -I tools/ci/fetch_qt_windows.py
          --version "$QT_VERSION" --arch win64_msvc2022_64
          --components qtbase,qtsvg,qtimageformats
          --output "$RUNNER_TEMP/Qt/$QT_VERSION/msvc2022_64"

      # Independent of the Visual Studio release on the image: find the newest
      # installation with x64 C++ tools and load its compiler environment.
      - name: Set up MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsArgs = @('-latest', '-products', '*', '-requires', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64')
          $vs = & $vswhere @vsArgs -property installationPath
          if (-not $vs) { throw 'No Visual Studio installation with x64 C++ tools found' }
          $version = & $vswhere @vsArgs -property catalog_productDisplayVersion
          Write-Host "Using Visual Studio $version at $vs"
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Use Qt
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/Qt/$QT_VERSION/msvc2022_64"
          echo "QT_ROOT_DIR=$prefix" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$prefix" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      # Surface MSVC errors and warnings as annotations (readable via the API).
      - name: Enable MSVC problem matcher
        shell: bash
        run: echo "::add-matcher::.github/problem-matchers/msvc.json"

      - name: Configure
        run: cmake --preset ci-windows
      - name: Build
        run: cmake --build --preset ci-windows-${{ matrix.config }}
      - name: Test (default and de_AT locale)
        run: ctest --preset ci-windows-${{ matrix.config }}

  macos:
    name: macOS (arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read toolchain pins
        run: grep -E '^[A-Z_]+=' .github/qt-version.env >> "$GITHUB_ENV"

      - name: Install Ninja
        run: brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtimageformats
          aqtversion: ==${{ env.AQT_VERSION }}
          cache: true
          cache-key-prefix: qt-macos-arm64-appleclang

      - name: Enable GCC/Clang problem matcher
        run: echo "::add-matcher::.github/problem-matchers/gcc.json"

      - name: Configure
        run: cmake --preset ci-release -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Build
        run: cmake --build --preset ci-release
      - name: Test (default and de_AT locale)
        run: ctest --preset ci-release
