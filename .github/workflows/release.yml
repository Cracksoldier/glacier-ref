name: Release

# Builds, tests and packages Glacier Ref for Windows, Linux and macOS
# (M5.01 groundwork, docs/RELEASING.md).
# - A version tag (v0.1.0, v0.1.0-test.1, ...) also creates a draft GitHub
#   release with every package and SHA256SUMS.txt; publish it by hand.
# - A manual run (Actions > Release > Run workflow) only uploads the packages
#   as run artifacts (14 days).
# Every package is smoke-tested with the CI Qt moved away, so it can only use
# what it ships (spec §4: image plugins; §7: clean environment).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Derive the package version
        id: version
        run: |
          project="$(sed -n 's/^ *VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -n 1)"
          [ -n "$project" ] || { echo "::error::No project VERSION in CMakeLists.txt"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            case "$version" in
              "$project" | "$project"-*) ;;
              *) echo "::error::Tag $GITHUB_REF_NAME does not match the project version $project in CMakeLists.txt"; exit 1 ;;
            esac
          else
            version="$project-dev.${GITHUB_SHA::7}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Unsupported version '$version'"; exit 1
          fi
          # Pre-1.0 and suffixed versions are test builds.
          prerelease=false
          if [[ "$version" == 0.* || "$version" == *-* ]]; then prerelease=true; fi
          echo "Package version: $version (prerelease: $prerelease)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux AppImage (x86_64)
    needs: version
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read toolchain pins
        run: grep -E '^[A-Z_]+=' .github/qt-version.env >> "$GITHUB_ENV"

      # The xcb and Wayland libraries must be present so linuxdeploy can
      # resolve the platform plugins' dependencies; xvfb runs the smoke test.
      - name: Install build, packaging and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build locales file xvfb xauth \
            libgl1-mesa-dev libegl1 libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-sync1 libxcb-xfixes0 libxcb-shm0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1
          sudo locale-gen de_AT.UTF-8

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtimageformats
          aqtversion: ==${{ env.AQT_VERSION }}
          cache: true
          cache-key-prefix: qt-linux-x64-gcc14

      - name: Configure
        run: cmake --preset ci-release -DGLACIER_BUILD_TOOLS=OFF
      - name: Build
        run: cmake --build --preset ci-release
      - name: Test (default and de_AT locale)
        run: ctest --preset ci-release

      - name: Package
        run: packaging/linux/build-appimage.sh build/ci-release "$VERSION" dist

      - name: Smoke test without the CI Qt
        run: |
          appimage="$PWD/dist/glacier-ref-$VERSION-linux-x86_64.AppImage"
          chmod +x "$appimage"
          mv "$QT_ROOT_DIR" "$QT_ROOT_DIR.hidden"
          trap 'mv "$QT_ROOT_DIR.hidden" "$QT_ROOT_DIR"' EXIT
          clean=(env -i "PATH=/usr/bin:/bin" "HOME=$HOME" LANG=C.UTF-8 APPIMAGE_EXTRACT_AND_RUN=1)
          # Needs no display; --version and --platform-info start the GUI.
          "${clean[@]}" "$appimage" --check-image-formats
          "${clean[@]}" xvfb-run -a "$appimage" --version
          "${clean[@]}" xvfb-run -a "$appimage" --platform-info

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glacier-ref-linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows:
    name: Windows ZIP (x64)
    needs: version
    runs-on: windows-2025
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read toolchain pins
        shell: bash
        run: grep -E '^[A-Z_]+=' .github/qt-version.env >> "$GITHUB_ENV"

      # Same Qt install as CI (see ci.yml and docs/TOOLCHAIN.md).
      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-windows-x64-msvc2022-${{ env.QT_VERSION }}-${{ hashFiles('tools/ci/fetch_qt_windows.py') }}

      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: bash
        run: >
          python -I tools/ci/fetch_qt_windows.py
          --version "$QT_VERSION" --arch win64_msvc2022_64
          --components qtbase,qtsvg,qtimageformats
          --output "$RUNNER_TEMP/Qt/$QT_VERSION/msvc2022_64"

      - name: Set up MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsArgs = @('-latest', '-products', '*', '-requires', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64')
          $vs = & $vswhere @vsArgs -property installationPath
          if (-not $vs) { throw 'No Visual Studio installation with x64 C++ tools found' }
          $version = & $vswhere @vsArgs -property catalog_productDisplayVersion
          Write-Host "Using Visual Studio $version at $vs"
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Use Qt
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/Qt/$QT_VERSION/msvc2022_64"
          echo "QT_ROOT_DIR=$prefix" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$prefix" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake --preset ci-windows -DGLACIER_BUILD_TOOLS=OFF
      - name: Build
        run: cmake --build --preset ci-windows-release
      - name: Test (default and de_AT locale)
        run: ctest --preset ci-windows-release

      - name: Package
        shell: pwsh
        run: packaging/windows/stage.ps1 -BuildDir build/ci-windows -Version $env:VERSION -OutDir dist

      - name: Smoke test without the CI Qt
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\stage\glacier-ref-$env:VERSION-windows-x64\glacier-ref.exe"
          $qt = $env:QT_ROOT_DIR
          Rename-Item -Path $qt -NewName "$(Split-Path $qt -Leaf).hidden"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          try {
            foreach ($arg in @('--version', '--check-image-formats', '--platform-info')) {
              $p = Start-Process -FilePath $exe -ArgumentList $arg -NoNewWindow -PassThru `
                -RedirectStandardOutput out.txt -RedirectStandardError err.txt
              $null = $p.Handle # keeps the exit code available
              $p.WaitForExit()
              Get-Content out.txt, err.txt
              if ($p.ExitCode -ne 0) { throw "glacier-ref $arg exited with $($p.ExitCode)" }
            }
          } finally {
            Rename-Item -Path "$qt.hidden" -NewName (Split-Path $qt -Leaf)
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glacier-ref-windows-x64
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  macos:
    name: macOS DMG (arm64)
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read toolchain pins
        run: grep -E '^[A-Z_]+=' .github/qt-version.env >> "$GITHUB_ENV"

      - name: Install Ninja
        run: brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtimageformats
          aqtversion: ==${{ env.AQT_VERSION }}
          cache: true
          cache-key-prefix: qt-macos-arm64-appleclang

      - name: Configure
        run: cmake --preset ci-release -DCMAKE_OSX_ARCHITECTURES=arm64 -DGLACIER_BUILD_TOOLS=OFF
      - name: Build
        run: cmake --build --preset ci-release
      - name: Test (default and de_AT locale)
        run: ctest --preset ci-release

      - name: Package
        run: packaging/macos/build-dmg.sh build/ci-release "$VERSION" dist

      - name: Smoke test without the CI Qt
        run: |
          exe="$PWD/dist/stage/Glacier Ref.app/Contents/MacOS/glacier-ref"
          mv "$QT_ROOT_DIR" "$QT_ROOT_DIR.hidden"
          trap 'mv "$QT_ROOT_DIR.hidden" "$QT_ROOT_DIR"' EXIT
          clean=(env -i "PATH=/usr/bin:/bin" "HOME=$HOME" LANG=en_US.UTF-8)
          "${clean[@]}" "$exe" --version
          "${clean[@]}" "$exe" --check-image-formats
          "${clean[@]}" "$exe" --platform-info
          hdiutil verify "dist/glacier-ref-$VERSION-macos-arm64.dmg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glacier-ref-macos-arm64
          path: dist/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the draft release and upload its assets
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: glacier-ref-*
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        run: |
          cd dist
          sha256sum glacier-ref-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@COMMIT@/$GITHUB_SHA/g" \
            packaging/release-notes.md > "$RUNNER_TEMP/notes.md"

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags=(--draft --verify-tag --title "Glacier Ref $VERSION" --notes-file "$RUNNER_TEMP/notes.md")
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${flags[@]}" dist/*
          fi
